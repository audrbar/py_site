[project]
name = "py-site"
version = "0.1.0"
description = "Streamlit multi-page application with project management, data exploration, and PDF AI assistant"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "streamlit>=1.37.1",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    # Database
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.31",
    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "pillow>=10.3.0",
    "streamlit-lottie>=0.0.5",
    # PDF and Document Processing
    "PyPDF2==3.0.1",
    # AI/ML and LangChain
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "openai>=1.9.0",
    "faiss-cpu>=1.8.0.post1",
    # Utilities
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "pathlib>=1.0.1",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
